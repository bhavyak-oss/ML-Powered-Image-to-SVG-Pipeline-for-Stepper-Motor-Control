name: OCR Module CI

on:
  push:
    branches: [main]
    paths:
      - 'ocr_module/**'
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q ocr_module
